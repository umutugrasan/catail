<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Pastel pink tile with two overlapping S strokes: "Stack Screen". -->
  <rect x="32" y="32" width="960" height="960" rx="230" fill="#F7B3CF"/>
  <rect x="32" y="32" width="960" height="960" rx="230" fill="none" stroke="#EE93BA" stroke-width="16"/>
  <!-- Back S, offset up-right like a stacked card. -->
  <path d="M 655 300 C 620 225 455 230 455 345 C 455 455 680 450 680 575 C 680 705 500 720 445 625"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.75" stroke-width="92" stroke-linecap="round"/>
  <!-- Front S. -->
  <path d="M 545 410 C 510 335 345 340 345 455 C 345 565 570 560 570 685 C 570 815 390 830 335 735"
        fill="none" stroke="#5B2141" stroke-width="92" stroke-linecap="round"/>
</svg>
